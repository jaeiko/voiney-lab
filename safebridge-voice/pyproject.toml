[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "safebridge-voice"
version = "0.1.0"
description = "Voice-first safety dispatcher for approved procedures and auditable human handoff"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "openai",
  "python-dotenv",
  "requests",
  "webrtcvad-wheels==2.0.14",
  "websockets>=14,<17",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
safebridge_voice = ["static/*.html"]
