<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>M3 Listener</title>
<style>
  :root { color-scheme:dark; --bg:#101218; --panel:#1b1f2a; --ink:#edf0f7; --dim:#9ca3b4; --hot:#e65b45; --ok:#64d49b; }
  * { box-sizing:border-box; }
  body { margin:0 auto; padding:2rem 1rem; max-width:48rem; background:var(--bg); color:var(--ink); font:16px/1.45 system-ui,sans-serif; }
  h1 { margin:0; font-size:1.5rem; }
  #status { color:var(--dim); margin:.35rem 0; }
  #state { display:inline-block; margin:.4rem 0 1rem; padding:.25rem .55rem; border:1px solid #3a4151; border-radius:.35rem; color:var(--ok); font:700 .8rem ui-monospace,monospace; }
  .controls { display:flex; gap:.7rem; margin-bottom:1rem; }
  button { padding:.65rem 1rem; border:0; border-radius:.4rem; font:inherit; font-weight:700; cursor:pointer; }
  #start { background:var(--hot); color:white; } #stop { background:#343a49; color:white; }
  button:disabled { opacity:.45; cursor:default; }
  #boundaries { padding:.7rem; min-height:3rem; background:#0b0d12; border-radius:.4rem; color:var(--dim); font:13px/1.45 ui-monospace,monospace; white-space:pre-wrap; }
  .turn { margin-top:1rem; padding:1rem; background:var(--panel); border-radius:.6rem; }
  .turn h2 { margin:0 0 .5rem; font-size:1rem; }
  .label { color:var(--dim); font-size:.72rem; text-transform:uppercase; margin-top:.5rem; }
  .stats { color:var(--dim); font-size:.85rem; margin-top:.7rem; }
  .error { color:#ff8b7d; white-space:pre-wrap; }
</style>
</head>
<body>
<h1>M3 — Listener</h1>
<div id="status">Connecting…</div>
<div id="state">DISCONNECTED</div>
<div class="controls">
  <button id="start" disabled>Start Session</button>
  <button id="stop" disabled>Stop Session</button>
</div>
<div id="boundaries">Turn boundaries will appear here.</div>
<div id="log"></div>

<script>
const $ = id => document.getElementById(id);
let socket, micContext, processor, micSource, sessionActive = false;
let playContext, receiving = null, receivedFrames = [], playAt = 0;
const turns = new Map();

function status(text) { $("status").textContent = text; }
function setState(value) { $("state").textContent = value; }
function sendControl(type, fields={}) {
  if (socket?.readyState === WebSocket.OPEN) socket.send(JSON.stringify({type, ...fields}));
}
function boundary(text) {
  const line = `[${new Date().toLocaleTimeString()}] ${text}`;
  $("boundaries").textContent = $("boundaries").textContent.startsWith("Turn boundaries") ? line : line+"\n"+$("boundaries").textContent;
}

async function init() {
  socket = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws`);
  socket.binaryType = "arraybuffer";
  socket.onmessage = onMessage;
  socket.onclose = () => {
    sessionActive=false; setState("DISCONNECTED"); status("Disconnected. Reload to reconnect.");
    $("start").disabled=true; $("stop").disabled=true;
  };
  socket.onerror = () => status("WebSocket connection failed.");
}

async function ensureAudio() {
  if (!processor) {
    const stream = await navigator.mediaDevices.getUserMedia({
      audio:{channelCount:1, echoCancellation:true, noiseSuppression:true, autoGainControl:false}
    });
    micContext = new AudioContext({sampleRate:16000});
    if (micContext.sampleRate !== 16000) throw new Error(`Browser created ${micContext.sampleRate} Hz audio; this demo requires 16000 Hz.`);
    micSource = micContext.createMediaStreamSource(stream);
    processor = micContext.createScriptProcessor(1024, 1, 1);
    processor.onaudioprocess = event => {
      if (!sessionActive || socket.readyState !== WebSocket.OPEN) return;
      const floats=event.inputBuffer.getChannelData(0), pcm=new Int16Array(floats.length);
      for (let i=0; i<floats.length; i++) pcm[i]=Math.max(-32768,Math.min(32767,Math.round(floats[i]*32767)));
      socket.send(pcm.buffer);
    };
    micSource.connect(processor);
    processor.connect(micContext.destination);
  }
  playContext ||= new AudioContext({sampleRate:16000});
  await Promise.all([micContext.resume(), playContext.resume()]);
}

async function startSession() {
  try {
    await ensureAudio();
    sessionActive=true;
    sendControl("session.start");
    $("start").disabled=true; $("stop").disabled=false;
    status("Listening hands-free.");
  } catch (error) { sessionActive=false; showError(error); }
}

function stopSession() {
  if (!sessionActive) return;
  sessionActive=false;
  sendControl("session.stop");
  receiving=null; receivedFrames=[]; playAt=0;
  $("start").disabled=false; $("stop").disabled=true;
  setState("IDLE"); status("Session stopped.");
}

function makeTurn(turnId) {
  const node=document.createElement("section"); node.className="turn";
  node.innerHTML=`<h2>Turn ${turnId}</h2><div class="label">You</div><div class="transcript">Listening…</div><div class="label">Agent</div><div class="reply">…</div><div class="stats"></div><div class="error"></div>`;
  $("log").prepend(node); turns.set(turnId,node);
  while (turns.size > 20) turns.delete(turns.keys().next().value);
  return node;
}
function turnNode(turnId) { return turns.get(turnId) || makeTurn(turnId); }

async function onMessage(event) {
  if (typeof event.data !== "string") {
    if (receiving) receivedFrames.push(event.data);
    return;
  }
  const message=JSON.parse(event.data);
  if (message.type === "ready") {
    status("Ready. Click Start Session once."); setState("IDLE"); $("start").disabled=false;
  }
  if (message.type === "session.started") { setState(message.state); status("Listening hands-free."); }
  if (message.type === "session.stopped") { setState(message.state); }
  if (message.type === "state.changed") setState(message.state);
  if (message.type === "speech.start") {
    setState(message.state); turnNode(message.turn_id);
    boundary(`[SPEECH START] turn_id=${message.turn_id}`);
  }
  if (message.type === "speech.end") {
    setState(message.state);
    boundary(`[SPEECH END after ${(message.duration_ms/1000).toFixed(1)} s] turn_id=${message.turn_id}`);
  }
  if (message.type === "speech.rejected") {
    boundary(`[SPEECH REJECTED] turn_id=${message.turn_id} reason=${message.reason || "minimum_voiced_frames"}`);
    if (message.reason === "empty_transcript") {
      turnNode(message.turn_id).querySelector(".transcript").textContent="No speech recognized";
    }
  }
  if (message.type === "transcript") turnNode(message.turn_id).querySelector(".transcript").textContent=message.text;
  if (message.type === "reply") turnNode(message.turn_id).querySelector(".reply").textContent=message.text;
  if (message.type === "audio.start") { receiving=message; receivedFrames=[]; }
  if (message.type === "audio.end" && receiving && message.turn_id === receiving.turn_id) {
    const metadata=receiving, pcm=joinFrames(receivedFrames);
    receiving=null; receivedFrames=[];
    try { await playPcm(pcm,metadata.turn_id); }
    catch (error) {
      showError(error,metadata.turn_id);
      sessionActive=false; sendControl("session.stop");
    }
  }
  if (message.type === "turn.done") {
    const t=message.timings_ms;
    turnNode(message.turn_id).querySelector(".stats").textContent=
      `turn_id ${message.turn_id} · STT ${t.stt} ms · Grok ${t.llm} ms · TTS ${t.tts} ms · in ${message.input_frames} frames · out ${message.output_frames} frames`;
  }
  if (message.type === "error") showError(message.message,message.turn_id);
}

function joinFrames(frames) {
  const size=frames.reduce((sum,frame)=>sum+frame.byteLength,0);
  const joined=new Uint8Array(size); let offset=0;
  for (const frame of frames) { joined.set(new Uint8Array(frame),offset); offset+=frame.byteLength; }
  return joined.buffer;
}

async function playPcm(buffer,turnId) {
  await playContext.resume();
  const input=new Int16Array(buffer), audio=playContext.createBuffer(1,input.length,16000);
  const output=audio.getChannelData(0);
  for (let i=0;i<input.length;i++) output[i]=input[i]/32768;
  const source=playContext.createBufferSource(); source.buffer=audio; source.connect(playContext.destination);
  playAt=Math.max(playAt,playContext.currentTime+0.06);
  source.start(playAt); playAt+=audio.duration;
  source.onended=() => {
    if (sessionActive) sendControl("playback.ended",{turn_id:turnId});
    playAt=Math.max(playAt,playContext.currentTime);
  };
}

function showError(error,turnId) {
  const text=String(error?.message || error);
  if (turnId) turnNode(turnId).querySelector(".error").textContent=text;
  status("Error: "+text);
}

$("start").addEventListener("click",startSession);
$("stop").addEventListener("click",stopSession);
init();
</script>
</body>
</html>
