<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>M2 Plumber</title>
<style>
  :root { color-scheme: dark; --bg:#101218; --panel:#1b1f2a; --ink:#edf0f7; --dim:#9ca3b4; --hot:#e65b45; }
  * { box-sizing:border-box; }
  body { margin:0 auto; padding:2rem 1rem; max-width:44rem; background:var(--bg); color:var(--ink); font:16px/1.45 system-ui,sans-serif; }
  h1 { margin:0; font-size:1.4rem; } #status { color:var(--dim); min-height:1.5rem; margin:.3rem 0 1rem; }
  .controls { display:flex; gap:1rem; align-items:center; flex-wrap:wrap; }
  select,button { font:inherit; }
  #ptt { width:8rem; height:8rem; border:0; border-radius:50%; background:var(--hot); color:white; font-weight:700; touch-action:none; }
  #ptt.active { transform:scale(1.08); box-shadow:0 0 0 10px #e65b4540; }
  #ptt:disabled { opacity:.45; }
  .turn { margin-top:1rem; padding:1rem; background:var(--panel); border-radius:.6rem; }
  .label { color:var(--dim); font-size:.75rem; text-transform:uppercase; margin-top:.5rem; }
  .stats { color:var(--dim); font-size:.85rem; margin-top:.7rem; }
  .comparison { display:none; grid-template-columns:1fr 1fr; gap:.75rem; margin-top:.5rem; }
  .comparison.show { display:grid; }
  .comparison > div { padding:.65rem; border:1px solid #343a49; border-radius:.4rem; }
  .preview { display:none; gap:.5rem; margin-top:.7rem; }.preview.show { display:flex; }
  .error { color:#ff8b7d; white-space:pre-wrap; }
</style>
</head>
<body>
<h1>M2 — Plumber</h1>
<div id="status">Connecting…</div>
<div class="controls">
  <button id="ptt" disabled>HOLD<br>TO TALK</button>
  <label>Input path
    <select id="mode">
      <option value="clean">Clean</option>
      <option value="phone">Simulated phone</option>
      <option value="compare">Compare one capture</option>
    </select>
  </label>
</div>
<div id="log"></div>

<script>
const $ = id => document.getElementById(id);
let socket, micContext, processor, micSource, recording = false, busy = false;
let receiving = null, receivedFrames = [], currentTurn = null;
let playContext, playAt = 0;

function status(text) { $("status").textContent = text; }
function sendControl(type, fields={}) { socket.send(JSON.stringify({type, ...fields})); }

async function init() {
  socket = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws`);
  socket.binaryType = "arraybuffer";
  socket.onmessage = onMessage;
  socket.onclose = () => { status("Disconnected. Reload to reconnect."); $("ptt").disabled = true; };
  socket.onerror = () => status("WebSocket connection failed.");
}

async function ensureMic() {
  if (processor) return;
  const stream = await navigator.mediaDevices.getUserMedia({audio:{channelCount:1, echoCancellation:true, noiseSuppression:true}});
  micContext = new AudioContext({sampleRate:16000});
  if (micContext.sampleRate !== 16000) throw new Error(`Browser created ${micContext.sampleRate} Hz audio; this demo requires 16000 Hz.`);
  micSource = micContext.createMediaStreamSource(stream);
  // ScriptProcessor is intentionally used for a compact teaching demo; AudioWorklet is the production replacement.
  processor = micContext.createScriptProcessor(1024, 1, 1);
  processor.onaudioprocess = event => {
    if (!recording || socket.readyState !== WebSocket.OPEN) return;
    const floats = event.inputBuffer.getChannelData(0), pcm = new Int16Array(floats.length);
    for (let i=0; i<floats.length; i++) pcm[i] = Math.max(-32768, Math.min(32767, Math.round(floats[i] * 32767)));
    socket.send(pcm.buffer);
  };
  micSource.connect(processor);
  processor.connect(micContext.destination);
}

async function startCapture(event) {
  event?.preventDefault();
  if (recording || busy || socket.readyState !== WebSocket.OPEN) return;
  try {
    await ensureMic(); await micContext.resume();
    currentTurn = makeTurn();
    sendControl("capture.start", {mode:$("mode").value});
    recording = true; $("ptt").classList.add("active"); status("Recording… release to send.");
  } catch (error) { showError(error); }
}
function stopCapture(event) {
  event?.preventDefault();
  if (!recording) return;
  recording = false; busy = true; $("ptt").classList.remove("active"); $("ptt").disabled = true;
  sendControl("capture.stop"); status("Thinking…");
}

function makeTurn() {
  const node = document.createElement("section"); node.className="turn";
  node.innerHTML='<div class="label">You</div><div class="transcript">…</div><div class="comparison"><div><div class="label">Clean STT</div><div class="clean-transcript"></div><div class="clean-timing stats"></div></div><div><div class="label">Phone STT</div><div class="phone-transcript"></div><div class="phone-timing stats"></div></div></div><div class="label">Agent</div><div class="reply">…</div><div class="stats turn-stats"></div><div class="preview"><button data-stream="clean-preview">Play clean capture</button><button data-stream="phone-preview">Play phone capture</button></div><div class="error"></div>';
  $("log").prepend(node); node.audio = {}; return node;
}

function onMessage(event) {
  if (typeof event.data !== "string") {
    if (receiving) receivedFrames.push(event.data); return;
  }
  const message = JSON.parse(event.data);
  if (message.type === "ready") { status("Hold the button, speak, then release."); $("ptt").disabled=false; }
  if (message.type === "audio.start") { receiving=message; receivedFrames=[]; }
  if (message.type === "audio.end" && receiving) {
    const pcm = joinFrames(receivedFrames); currentTurn.audio[receiving.stream]=pcm;
    if (receiving.stream === "tts") queuePcm(pcm);
    if (receiving.stream.includes("preview")) currentTurn.querySelector(".preview").classList.add("show");
    receiving=null; receivedFrames=[];
  }
  if (message.type === "transcript") currentTurn.querySelector(".transcript").textContent=message.text;
  if (message.type === "comparison.result") {
    currentTurn.querySelector(".transcript").textContent=message.clean_transcript;
    currentTurn.querySelector(".clean-transcript").textContent=message.clean_transcript;
    currentTurn.querySelector(".phone-transcript").textContent=message.phone_transcript;
    currentTurn.querySelector(".clean-timing").textContent=`${message.clean_stt_ms} ms`;
    currentTurn.querySelector(".phone-timing").textContent=`${message.phone_stt_ms} ms`;
    currentTurn.querySelector(".comparison").classList.add("show");
  }
  if (message.type === "reply") currentTurn.querySelector(".reply").textContent=message.text;
  if (message.type === "turn.done") {
    const t=message.timings_ms;
    const stt = message.mode === "compare" ? `clean STT ${t.stt_clean} ms · phone STT ${t.stt_phone} ms` : `STT ${t.stt} ms`;
    currentTurn.querySelector(".turn-stats").textContent=`${message.mode} · ${stt} · Grok ${t.llm} ms · TTS ${t.tts} ms · in ${message.input_frames} frames · out ${message.output_frames} frames`;
    busy=false; $("ptt").disabled=false; status("Hold the button for another turn.");
  }
  if (message.type === "error") showError(message.message);
}

function joinFrames(frames) {
  const size=frames.reduce((sum, frame)=>sum+frame.byteLength,0), joined=new Uint8Array(size); let offset=0;
  for (const frame of frames) { joined.set(new Uint8Array(frame),offset); offset+=frame.byteLength; }
  return joined.buffer;
}
async function queuePcm(buffer) {
  playContext ||= new AudioContext({sampleRate:16000}); await playContext.resume();
  const input=new Int16Array(buffer), audio=playContext.createBuffer(1,input.length,16000), output=audio.getChannelData(0);
  for (let i=0;i<input.length;i++) output[i]=input[i]/32768;
  const source=playContext.createBufferSource(); source.buffer=audio; source.connect(playContext.destination);
  // Keep at least three 20 ms frames queued to absorb ordinary browser scheduling jitter.
  playAt=Math.max(playAt,playContext.currentTime+0.06); source.start(playAt); playAt+=audio.duration;
}
function showError(error) {
  const text=String(error?.message || error); (currentTurn || makeTurn()).querySelector(".error").textContent=text;
  busy=false; recording=false; $("ptt").disabled=socket?.readyState!==WebSocket.OPEN; status("Error: "+text);
}

$("ptt").addEventListener("pointerdown", startCapture);
$("ptt").addEventListener("pointerup", stopCapture);
$("ptt").addEventListener("pointercancel", stopCapture);
$("log").addEventListener("click", event => {
  const stream=event.target.dataset.stream, turn=event.target.closest(".turn");
  if (stream && turn.audio[stream]) queuePcm(turn.audio[stream]);
});
init();
</script>
</body>
</html>
