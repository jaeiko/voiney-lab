<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>M4 SafeBridge</title><style>
body{margin:0 auto;padding:2rem 1rem;max-width:48rem;background:#101218;color:#edf0f7;font:16px/1.45 system-ui,sans-serif}button{padding:.65rem 1rem;margin:.3rem}.turn{margin-top:1rem;padding:1rem;background:#1b1f2a;border-radius:.6rem}.label,.stats,#status{color:#9ca3b4}.error{color:#ff8b7d}#state{color:#64d49b;font-weight:700}
</style></head><body>
<h1>M4 — SafeBridge Brain</h1><div id="status">Ready. Click Start once.</div><div id="state">IDLE</div>
<button id="start">Start Session</button><button id="stop" disabled>Stop Session</button><div id="log"></div>
<script>
const $=id=>document.getElementById(id);
let socket,micContext,processor,micSource,playContext,sessionActive=false;
let receiving=null,receivedFrames=[],activeTurn=null,audioComplete=false,turnComplete=false,playing=false,nextSegment=0,activeSource=null,sessionGeneration=0,playbackEpoch=0,visibleState="IDLE";
const queued=new Map(),turns=new Map();
const UI={
 IDLE:["Ready. Click Start once.",false,true],CONNECTING:["Connecting and starting microphone…",true,false],LISTENING:["Listening…",true,false],
 THINKING:["Thinking…",true,false],SPEAKING:["Speaking…",true,false],ERROR:["Session failed. Click Start to retry.",false,true],
 INTERRUPTING:["Interrupting…",true,false],RECONNECTING:["Reconnecting…",true,false]
};
function renderState(state,detail=""){const view=UI[state]||UI.ERROR;visibleState=UI[state]?state:"ERROR";document.getElementById("state").textContent=visibleState;document.getElementById("status").textContent=detail||view[0];document.getElementById("start").disabled=view[1];document.getElementById("stop").disabled=view[2];}
function sendControl(type,fields={}){if(socket?.readyState===WebSocket.OPEN)socket.send(JSON.stringify({type,...fields}));}
function clearPlayback(){playbackEpoch++;if(activeSource){activeSource.onended=null;try{activeSource.stop();}catch(_){}try{activeSource.disconnect();}catch(_){}activeSource=null;}receiving=null;receivedFrames=[];queued.clear();activeTurn=null;audioComplete=false;turnComplete=false;playing=false;nextSegment=0;}
function resetSessionUI(){clearPlayback();turns.clear();$("log").replaceChildren();}
async function closeAudio(){if(processor){processor.onaudioprocess=null;try{processor.disconnect();}catch(_){}processor=null;}if(micSource){for(const track of micSource.mediaStream?.getTracks?.()||[])track.stop();try{micSource.disconnect();}catch(_){}micSource=null;}for(const context of [micContext,playContext])if(context&&context.state!=="closed")try{await context.close();}catch(_){}micContext=null;playContext=null;}
function turnNode(id,generation=sessionGeneration){const key=`${generation}:${id}`;if(turns.has(key))return turns.get(key);const node=document.createElement("section");node.className="turn";node.innerHTML=`<b>Turn ${id}</b><div class="label">You</div><div class="transcript">Listening…</div><div class="label">SafeBridge</div><div class="reply"></div><div class="stats"></div><div class="error"></div>`;$("log").prepend(node);turns.set(key,node);return node;}
function fail(error,id){const text=String(error?.message||error);sessionActive=false;if(id)turnNode(id).querySelector(".error").textContent=text;clearPlayback();renderState("ERROR","Error: "+text);}
async function init(generation=sessionGeneration){return new Promise((resolve,reject)=>{const scheme=location.protocol==="https:"?"wss":"ws",current=new WebSocket(scheme+"://"+location.host+"/ws");socket=current;current.binaryType="arraybuffer";current.onopen=()=>{if(generation===sessionGeneration&&socket===current)resolve();};current.onmessage=e=>onMessage(e,generation,current);current.onclose=()=>{if(generation!==sessionGeneration||socket!==current)return;sessionActive=false;clearPlayback();renderState("ERROR","Connection closed unexpectedly.");};current.onerror=()=>{if(generation!==sessionGeneration||socket!==current)return;fail("WebSocket connection failed");reject(new Error("WebSocket connection failed"));};});}
async function ensureAudio(generation){
 if(!processor){const stream=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:true,noiseSuppression:true,autoGainControl:false}});
 micContext=new AudioContext({sampleRate:16000});if(micContext.sampleRate!==16000)throw new Error("16 kHz AudioContext required");
 micSource=micContext.createMediaStreamSource(stream);processor=micContext.createScriptProcessor(1024,1,1);
 processor.onaudioprocess=e=>{if(generation!==sessionGeneration||!sessionActive||socket?.readyState!==WebSocket.OPEN)return;const f=e.inputBuffer.getChannelData(0),p=new Int16Array(f.length);for(let i=0;i<f.length;i++)p[i]=Math.max(-32768,Math.min(32767,Math.round(f[i]*32767)));socket.send(p.buffer);};micSource.connect(processor);processor.connect(micContext.destination);}
 playContext||=new AudioContext({sampleRate:16000});await Promise.all([micContext.resume(),playContext.resume()]);
}
async function startSession(){const generation=sessionGeneration;renderState("CONNECTING");try{resetSessionUI();if(!socket||socket.readyState!==WebSocket.OPEN)await init(generation);if(generation!==sessionGeneration)return;await ensureAudio(generation);if(generation!==sessionGeneration)return;sendControl("session.start");}catch(e){if(generation===sessionGeneration)fail(e);}}
async function stopSession(){sessionActive=false;sessionGeneration++;sendControl("session.stop");clearPlayback();const oldSocket=socket;socket=null;await closeAudio();if(oldSocket&&oldSocket.readyState<WebSocket.CLOSING)oldSocket.close(1000,"session stopped");renderState("IDLE");}
function join(frames){const size=frames.reduce((n,x)=>n+x.byteLength,0),out=new Uint8Array(size);let at=0;for(const x of frames){out.set(new Uint8Array(x),at);at+=x.byteLength;}return out.buffer;}
async function pump(generation=sessionGeneration){
 if(generation!==sessionGeneration)return;
 if(playing)return;const item=queued.get(nextSegment);if(!item){if(audioComplete&&turnComplete&&activeTurn!==null&&queued.size===0){sendControl("playback.ended",{turn_id:activeTurn});clearPlayback();renderState("LISTENING");}return;}
 const epoch=playbackEpoch;queued.delete(nextSegment);playing=true;await playContext.resume();if(generation!==sessionGeneration||epoch!==playbackEpoch)return;const input=new Int16Array(item),audio=playContext.createBuffer(1,input.length,16000),samples=audio.getChannelData(0);for(let i=0;i<input.length;i++)samples[i]=input[i]/32768;
 const source=playContext.createBufferSource();activeSource=source;source.buffer=audio;source.connect(playContext.destination);source.onended=()=>{if(generation!==sessionGeneration||epoch!==playbackEpoch||activeSource!==source)return;activeSource=null;playing=false;nextSegment++;pump(generation);};source.start();if(generation===sessionGeneration&&epoch===playbackEpoch&&activeSource===source)renderState("SPEAKING");
}
async function onMessage(e,generation,current){
 if(generation!==sessionGeneration||socket!==current)return;
 if(typeof e.data!=="string"){if(receiving&&receiving.turn_id===activeTurn)receivedFrames.push(e.data);return;}
 const m=JSON.parse(e.data);
 if(m.type==="ready"&&visibleState==="IDLE")renderState("IDLE");
 if(m.type==="session.started"){sessionActive=true;renderState("LISTENING");}
 if(m.type==="session.stopped"){sessionActive=false;renderState("IDLE");}
 if(m.type==="state.changed"&&sessionActive&&m.state!=="AGENT_SPEAKING")renderState(m.state==="PROCESSING"?"THINKING":"LISTENING");
 if(m.type==="turn.processing"&&sessionActive)renderState("THINKING");
 if(m.type==="speech.start"){activeTurn=m.turn_id;turnNode(m.turn_id,generation);}
 if(m.type==="transcript")turnNode(m.turn_id,generation).querySelector(".transcript").textContent=m.text;
 if(m.type==="reply.delta"&&m.turn_id===activeTurn)turnNode(m.turn_id,generation).querySelector(".reply").textContent+=m.text+" ";
 if(m.type==="audio.segment.start"){if(activeTurn===null)activeTurn=m.turn_id;if(m.turn_id!==activeTurn||m.segment_index<nextSegment)return;receiving=m;receivedFrames=[];}
 if(m.type==="audio.segment.end"&&receiving&&m.turn_id===activeTurn&&m.segment_index===receiving.segment_index){queued.set(m.segment_index,join(receivedFrames));receiving=null;receivedFrames=[];pump(generation);}
 if(m.type==="audio.complete"&&m.turn_id===activeTurn){audioComplete=true;pump(generation);}
 if(m.type==="turn.done"){const t=m.timings_ms;turnNode(m.turn_id,generation).querySelector(".stats").textContent=`STT ${t.stt} ms · first audio ${t.first_audio_ms} ms · total ${t.total_ms} ms · ${m.segment_count} segments · ${m.output_frames} frames`;if(m.turn_id===activeTurn){turnComplete=true;pump(generation);}}
 if(m.type==="error")fail(m.message,m.turn_id);
}
$("start").addEventListener("click",startSession);$("stop").addEventListener("click",stopSession);init();
</script></body></html>
