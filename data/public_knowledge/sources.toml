# ---------------------------------------------------------------------------
# Candidates looked at and left out (decision 1 and additional decision 5)
# ---------------------------------------------------------------------------

[[excluded]]
id = "openstax-2e"
name = "OpenStax Chemistry 2e, Chemistry: Atoms First 2e, Biology 2e, Microbiology, Anatomy and Physiology 2e, College Physics 2e, Organic Chemistry"
reason = "The live editions are CC BY-NC-SA 4.0 (NC): the OpenStax CMS record and the books' collection.xml both say so. The CC BY first editions are used instead (openstax-chemistry-1e, openstax-biology-1e)."
evidence_url = "https://openstax.org/apps/cms/api/v2/pages/?type=books.Book&fields=title,license_name,license_version,license_url,book_state&limit=100"
checked = "2026-10-24"

[[excluded]]
id = "protocols-io"
name = "protocols.io public protocols"
reason = "Reading even public protocols through the API needs a client access token issued to a registered account (login required); the HTML pages are not taken without the API."
evidence_url = "https://apidoc.protocols.io/"
checked = "2026-10-24"

[[excluded]]
id = "materials-project"
name = "Materials Project"
reason = "The API needs a per-account API key (login required), although the data licence is CC BY 4.0."
evidence_url = "https://docs.materialsproject.org/downloading-data/using-the-api/getting-started"
checked = "2026-10-24"

[[excluded]]
id = "osha"
name = "OSHA laboratory safety publications (osha.gov)"
reason = "Public domain by the Department of Labor's policy, but osha.gov refuses the pipeline's requests (HTTP 403 for robots.txt and the publications; the copyright page answers 404), so nothing can be fetched in keeping with the site's rules. Left for a person to download by hand if wanted."
evidence_url = "https://www.dol.gov/general/aboutdol/copyright"
checked = "2026-10-24"

[[excluded]]
id = "echa"
name = "European Chemicals Agency (ECHA) C&L Inventory, including the GHS classifications PubChem cites from it"
reason = "ECHA's legal notice could not be read by the pipeline (HTTP 403); reproductions of it say reuse requires written notification to ECHA. Unverified, so PubChem statements whose reference is ECHA or the EU CLP regulation are dropped."
evidence_url = "https://echa.europa.eu/legal-notice"
checked = "2026-10-24"

[[excluded]]
id = "cameo-chemicals"
name = "CAMEO Chemicals (NOAA/EPA), including PubChem statements referencing it"
reason = "Its terms say data from the contributing organisations shall not be duplicated without their written permission."
evidence_url = "https://cameochemicals.noaa.gov/help/reference/terms_and_conditions.htm?d_f=false"
checked = "2026-10-24"

[[excluded]]
id = "pubchem-other-references"
name = "PubChem statements from NITE-CMC, HCIS (Safe Work Australia), Haz-Map, DrugBank, HMDB, T3DB, ChEBI, CAS Common Chemistry, AICIS, EU Food Improvement Agents and others not in allowed_references"
reason = "No licence read (NITE, HCIS, AICIS, ChEBI), copyrighted (Haz-Map), NC (DrugBank, CAS Common Chemistry) or commercial use restricted (HMDB). Wikipedia-referenced statements are left out because the Wikipedia source above holds the same text."
evidence_url = "https://pubchem.ncbi.nlm.nih.gov/rest/pug/sourcetable/all/JSON"
checked = "2026-10-24"

[[excluded]]
id = "kosha-msds"
name = "안전보건공단 화학물질정보 (MSDS)"
reason = "저작권정책: 무단 복제·배포 금지, 공익 목적이라도 별도 협의·허락 필요; Open API 는 공공데이터포털 활용신청(로그인) 필요. 공공누리 유형 표시 없음."
evidence_url = "https://msds.kosha.or.kr/MSDSInfo/kcic/copyright.do"
checked = "2026-10-24"

[[excluded]]
id = "korean-public-portals"
name = "국가법령정보센터·국가연구안전정보시스템 등 한국어 공공 자료"
reason = "Open API 가 인증키(회원가입) 를 요구하고, 사이트 화면은 스크립트로만 열려 공공누리 유형을 자동으로 확인할 수 없었다. 공공누리 제1유형이 확인된 문서를 사람이 지정하면 다음 실행에 'html'/'pdf' 출처로 더할 수 있다."
evidence_url = "https://www.kogl.or.kr/info/license.do"
checked = "2026-10-24"

[[excluded]]
id = "ncbi-bookshelf"
name = "NCBI Bookshelf books"
reason = "Licence is per book and none of the laboratory-safety titles looked at carries an open licence that could be verified in this run (the BMBL is taken from CDC directly)."
evidence_url = "https://www.ncbi.nlm.nih.gov/books/about/copyright/"
checked = "2026-10-24"

[[excluded]]
id = "pmc-nc-nd"
name = "PMC / Europe PMC articles under CC BY-NC, CC BY-ND or publisher-specific licences"
reason = "NC or ND; the europepmc-ccby source keeps only CC BY, CC BY-SA and CC0 articles."
evidence_url = "https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=LICENSE%3A%22cc%20by-nc%22&format=json&pageSize=1"
checked = "2026-10-24"
