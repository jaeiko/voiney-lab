# on 2026-10-25): electronic structure and bonding theory (6-8) and the
# descriptive chemistry of the elements (18-19) are left out; so is each
# chapter's end matter (key terms, equations, summary, exercises) and
# everything from the first appendix (appendices, answer key, index). The
