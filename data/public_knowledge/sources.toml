# ---------------------------------------------------------------------------
# Peer-reviewed open-access articles (grade A): Europe PMC, CC BY only,
# checked twice (the search record's licence and the article XML's own
# <license> element).
# ---------------------------------------------------------------------------

[[source]]
id = "europepmc-ccby"
name = "Europe PMC open-access articles (CC BY)"
kind = "europepmc"
grade = "A"
domains = ["biology", "chemistry", "materials", "equipment"]
language = "en"
license = "CC BY (per article; recorded on each piece)"
license_url = "https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=LICENSE%3A%22cc%20by%22&format=json&resultType=core&pageSize=1"
license_checked = "2026-10-24"
license_note = "Each article's licence is read from the Europe PMC record (license field) and again from the full-text XML <license> element; only CC BY and CC0 are kept, CC BY-SA too; NC and ND never."
terms = "https://www.ebi.ac.uk/robots.txt sets no rule for /europepmc/webservices/ (User-agent: * has no Disallow for it); one request per second with the contact User-Agent."
base_url = "https://www.ebi.ac.uk/europepmc/webservices/rest/"
requests_per_second = 1.0
# 3 until 2026-10-26; 8 since lane KNOW2's v2 (person's decision 6: about
# 2,400 pieces of methods and troubleshooting, lane KAUDIT's P5).
max_per_query = 8
# At most this many pieces of one article (long reviews would drown the rest).
max_chunks_per_document = 40
# Only these sections of an article, a nested one by its parents' titles too
# (person's decision 2026-10-26, 3: methods, not results -- two result
# paragraphs lane KAUDIT saw attached to a help were off the point).
sections = ["method", "material", "protocol", "procedure", "experimental", "troubleshoot", "note", "tip",
            "critical", "caution", "safety", "preparation"]
# Each phrase must be in the article's title or abstract (`europepmc_query`);
# a query is run again on each collect and new CC BY hits are added, bounded
# by max_per_query per query.
queries = [
  "in-gel digestion",
  "SDS-PAGE troubleshooting OR SDS-PAGE artifacts",
  "western blot troubleshooting OR western blotting pitfalls",
  "PCR troubleshooting OR PCR optimization",
  "MIQE guidelines",
  "agarose gel electrophoresis",
  "Bradford assay OR BCA assay",
  "mycoplasma contamination",
  "bacterial transformation OR competent cells",
  "plasmid DNA extraction OR alkaline lysis",
  "coin cell assembly OR coin cell fabrication",
  "electrode slurry OR slurry casting",
  "cyclic voltammetry tutorial OR cyclic voltammetry practical",
  "electrochemical impedance spectroscopy tutorial OR impedance spectroscopy beginners",
  "powder X-ray diffraction sample preparation OR XRD sample preparation",
  "SEM sample preparation OR scanning electron microscopy sample preparation",
  "keratin contamination OR mass spectrometry contaminants",
  "laboratory safety training OR chemical safety laboratory",
  "buffer preparation OR pH buffer laboratory",
  "pipetting accuracy OR pipette calibration",
  # v2 (lane KNOW2, person's decision 2026-10-26, 6: lane KAUDIT's P5 --
  # troubleshooting at the bench and battery and materials methods; only the
  # methods, troubleshooting and notes sections are kept, see `sections`)
  "western blot background OR nonspecific bands",
  "PCR inhibition OR PCR inhibitors",
  "primer dimer OR nonspecific amplification",
  "qPCR troubleshooting OR qPCR optimization",
  "cell culture contamination OR microbial contamination",
  "mycoplasma detection",
  "cell detachment OR trypsinization",
  "ELISA optimization OR ELISA troubleshooting",
  "flow cytometry troubleshooting OR flow cytometry pitfalls",
  "transfection efficiency",
  "plasmid DNA yield OR DNA yield",
  "RNA degradation OR RNA integrity",
  "protein aggregation OR inclusion body solubilization",
  "acrylamide polymerization OR gel polymerization",
  "glovebox OR inert atmosphere",
  "lithium hexafluorophosphate electrolyte",
  "thermal runaway OR battery abuse test",
  "pouch cell OR coin cell",
  "electrode coating OR calendering",
  "lithium metal anode",
  "perovskite film",
  "nanoparticle synthesis",
  "recrystallization",
  "Schlenk line OR air-sensitive",
  "column chromatography",
  "protocol troubleshooting",
]
pmcids = []

