# ---------------------------------------------------------------------------
# Chemicals (grade A): PubChem records, kept only where the record's own
# reference is a source whose terms were read.
# ---------------------------------------------------------------------------

[[source]]
id = "pubchem"
name = "PubChem (NIH/NLM) compound records"
kind = "pubchem"
grade = "A"
domains = ["chemistry", "safety"]
language = "en"
license = "Public domain (NLM; per-reference sources below)"
license_url = "https://www.nlm.nih.gov/web_policies.html"
license_checked = "2026-10-24"
license_note = "NLM: works produced by the U.S. government are not subject to copyright; third-party content keeps its own terms. Each PubChem statement names its reference source; only the references listed in allowed_references are kept (their licence URL is the one PubChem's source table gives: https://pubchem.ncbi.nlm.nih.gov/rest/pug/sourcetable/all/JSON, read 2026-10-24)."
terms = "https://pubchem.ncbi.nlm.nih.gov/robots.txt (User-agent: *) disallows the PUG REST (/rest/pug/, the name lookup) and sets Crawl-delay 5, and allows /rest/pug_view/; so a name is turned into a CID through Wikidata's PubChem CID claim (P662, CC0) or given in the list, only PUG View is read, one request every 5 seconds, and PubChem's X-Throttling-Control header slows the pace further when it is not Green."
base_url = "https://pubchem.ncbi.nlm.nih.gov/rest/"
compounds_file = "pubchem_compounds.txt"
requests_per_second = 2.0
# Reference source names exactly as PubChem prints them, each with the licence
# its source-table row names.
allowed_references = [
  "PubChem",
  "Hazardous Substances Data Bank (HSDB)",
  "The National Institute for Occupational Safety and Health (NIOSH)",
  "NIOSH Manual of Analytical Methods",
  "Occupational Safety and Health Administration (OSHA)",
  # "ILO-WHO International Chemical Safety Cards (ICSCs)" was here until
  # 2026-10-26; left out by the person's decision (lane KNOW2), see the
  # [[excluded]] entry "ilo-icsc".
  "DTP/NCI",
  "NCI Thesaurus (NCIt)",
  "Drugs@FDA",
  "FDA Global Substance Registration System (GSRS)",
  "EPA Chemicals under the TSCA",
  "EPA DSSTox",
  "EPA Hazardous Air Pollutants",
  "EPA Acute Exposure Guideline Levels (AEGLs)",
  "NTP Technical Reports",
  "Medical Subject Headings (MeSH)",
]
# Licences of the allowed references (as PubChem's source table states them):
#   HSDB, MeSH, PubChem      NLM, public domain  https://www.nlm.nih.gov/web_policies.html
#   NIOSH, NMAM              CDC, public domain  https://www.cdc.gov/other/agencymaterials.html
#   OSHA                     DOL, public domain  https://www.dol.gov/general/aboutdol/copyright
#   (ILO ICSC: no longer allowed, see [[excluded]] "ilo-icsc")
#   DTP/NCI, NCIt            NCI, free of copyright  https://www.cancer.gov/policies/copyright-reuse
#   Drugs@FDA, GSRS          FDA, public domain  https://www.fda.gov/about-fda/about-website/website-policies#linking
#   EPA (TSCA, DSSTox, HAPs, AEGLs), NTP   U.S. Government works
# Headings kept (PubChem TOC names); everything else in a record is left out.
