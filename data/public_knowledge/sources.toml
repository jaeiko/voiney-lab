# Public knowledge sources (lane KNOW, human decision 2026-10-24).
#
# scripts/public_knowledge_pipeline.py reads this file: each [[source]] is
# fetched, cut into pieces and put into the public bundle under
# data/runtime/public-knowledge/ (never committed). Add a source here and the
# next `collect` run takes it in; a source whose material has not changed is
# not fetched again.
#
# What may be listed (decision 1): public domain, CC0, CC BY and CC BY-SA
# only, with the licence evidence URL, the date it was read, and the terms of
# use that bind the fetch (rate limit, robots.txt). NC and ND material,
# copyrighted books and web articles and anything behind a login are not
# listed as a source; the candidates that were looked at and left out are the
# [[excluded]] entries at the end, each with its reason.
#
# grade (additional decision 3): "A" = public institution, standard or
# peer-reviewed article; "B" = open textbook; "C" = wiki. The answer uses a
# higher grade first and says so when a wiki is the only ground.
#
# Of the same material only the latest is kept (human decision 2026-10-24):
# a document is fetched again only when its source changed (revision id,
# ETag, refresh interval) and the new copy replaces the old; the same words
# from two sources keep the copy whose version or fetched date is later.

version = 1
# Wikimedia's User-Agent policy wants a descriptive agent with a way to reach
# the operator; the repository address is that contact.
user_agent = "VoineyLabPublicKnowledge/0.1 (https://github.com/jaeiko/voiney-lab)"

