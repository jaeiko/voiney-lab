[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voiney-lab"
version = "0.1.0"
description = "Trusted laboratory protocol knowledge, voice execution, and auditable integration layer"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  # fastapi: held on the 0.141 line, the release the last known-good
  # environment ran (pip freeze, 2026-09-30).  0.142.0 calls
  # run_in_threadpool(_run_sync_endpoint, function=..., arguments=...),
  # and the tests' thread-pool fakes
  # (_dedicated_to_thread in tests/test_protocol_catalog.py, run_inline in
  # tests/test_experiment_reports.py) take their callable as `function`, so
  # six endpoint tests fail with "got multiple values for argument
  # 'function'".  Starlette's own parameter is `func`.  Only fastapi is held:
  # with every other dependency at its 2026-10-01 latest (Starlette 1.7.0)
  # the suite gives the same result as the known-good freeze.
  "fastapi>=0.141.1,<0.142",
  "uvicorn[standard]",
  "openai",
  "PyJWT[crypto]>=2.10,<3",
  # pypdf: used by curated_protocol.py (development fixture page check) and by
  # the tests' PDF fixture writers.  Protocol PDF reading no longer uses it.
  # BSD-3-Clause.
  "pypdf==6.12.0",
  # pymupdf: the one PDF engine -- page text, blocks, metadata, encryption,
  # page count, and page images for OCR -- used only through
  # pdf_text_engine.py.  AGPL-3.0, accepted on 2026-10-02 on the condition
  # that it stays behind that one module so it can be replaced.
  "pymupdf==1.28.2",
  "python-dotenv",
  "requests",
  "webrtcvad-wheels==2.0.14",
  "websockets>=14,<17",
  "python-docx==1.2.0",
]

[project.scripts]
voiney-replay = "voiney_lab.replay_turns:main"
voiney-evaluate = "voiney_lab.voice_evaluation:main"

[project.optional-dependencies]
moss = [
  "moss>=1.0.0b19,<2",
]
test = [
  "pytest>=8",
  "httpx>=0.27",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
voiney_lab = ["static/*.html", "static/*.js", "static/*.css"]
