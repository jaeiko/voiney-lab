[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voiney-lab"
version = "0.1.0"
description = "VoineyLab: hands-free voice guide that runs a lab's own uploaded protocol step by step"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  # fastapi: held on the 0.141 line, the release the last known-good
  # environment ran (pip freeze, 2026-09-30).  0.142.0 calls
  # run_in_threadpool(_run_sync_endpoint, function=..., arguments=...),
  # and the tests' thread-pool fakes
  # (_dedicated_to_thread in tests/test_protocol_catalog.py, run_inline in
  # tests/test_experiment_reports.py) take their callable as `function`, so
  # six endpoint tests fail with "got multiple values for argument
  # 'function'".  Starlette's own parameter is `func`.  Only fastapi is held:
  # with every other dependency at its 2026-10-01 latest (Starlette 1.7.0)
  # the suite gives the same result as the known-good freeze.
  "fastapi>=0.141.1,<0.142",
  "uvicorn[standard]",
  # Model provider SDKs (lane M1, 2026-10-05), pinned to the versions the
  # adapters in model_providers.py were written and contract-tested against.
  # openai: xAI (its OpenAI-compatible API) and OpenAI (the Responses API).
  "openai==3.3.1",
  "anthropic==1.11.0",
  # google-genai: the Gemini API (generativelanguage), not Vertex AI.
  "google-genai==2.28.0",
  "PyJWT[crypto]>=2.10,<3",
  # pypdf: used by curated_protocol.py (development fixture page check) and by
  # the tests' PDF fixture writers.  Protocol PDF reading no longer uses it.
  # BSD-3-Clause.
  "pypdf==6.12.0",
  # pymupdf: the one PDF engine -- page text, blocks, metadata, encryption,
  # page count, and page images for OCR -- used only through
  # pdf_text_engine.py.  AGPL-3.0, accepted on 2026-10-02 on the condition
  # that it stays behind that one module so it can be replaced.
  "pymupdf==1.28.2",
  "python-dotenv",
  "requests",
  "httpx>=0.27",
  "webrtcvad-wheels==2.0.14",
  "websockets>=14,<17",
  "python-docx==1.2.0",
  # Pillow: a photo of a protocol becomes the one-page image PDF that OCR
  # reads (lane AN, FM, 2026-10-13). MIT-CMU.
  "Pillow==12.3.0",
  # openpyxl: an .xlsx attached to a protocol as its reagent table, read
  # cell by cell (lane AN, FM, 2026-10-13). MIT.
  "openpyxl==3.1.5",
]

[project.scripts]
voiney-replay = "voiney_lab.replay_turns:main"
voiney-evaluate = "voiney_lab.voice_evaluation:main"

[project.optional-dependencies]
test = [
  "pytest>=8",
]
# HEIC photos (lane AN, FM). Optional (human decision 2026-10-13): the
# pillow-heif source is BSD-3-Clause, but its binary wheels bundle libheif and
# libde265 (LGPLv3) and x265 (GPLv2) and are GPLv2 as a whole; whether to ship
# them is the organisation's call. Without it a HEIC upload is refused with
# heic_support_unavailable. docs/SOURCE_FORMATS.md says how to install it.
heic = [
  "pillow-heif==1.8.1",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
voiney_lab = ["static/*.html", "static/*.js", "static/*.css"]
