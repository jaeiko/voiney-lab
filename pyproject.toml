[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-workflow-agent"
version = "0.1.0"
description = "Trusted laboratory protocol knowledge, voice execution, and auditable integration layer"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "openai",
  "PyJWT[crypto]>=2.10,<3",
  # pypdf: PDF structure, metadata, encryption detection, and the error
  # taxonomy below.  Its text extractor is NOT used -- see
  # experiment_protocol_pdf.py.  BSD-3-Clause.
  "pypdf==6.12.0",
  # pypdfium2: primary page-text extractor.  Binding is Apache-2.0 OR
  # BSD-3-Clause; the bundled PDFium engine is BSD-3-Clause.
  "pypdfium2==5.13.0",
  "python-dotenv",
  "requests",
  "webrtcvad-wheels==2.0.14",
  "websockets>=14,<17",
  "python-docx==1.2.0",
]

[project.scripts]
voice-workflow-replay = "voice_workflow_agent.replay_turns:main"
voice-workflow-evaluate = "voice_workflow_agent.voice_evaluation:main"

[project.optional-dependencies]
moss = [
  "moss>=1.0.0b19,<2",
]
test = [
  "pytest>=8",
  "httpx>=0.27",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
voice_workflow_agent = ["static/*.html", "static/*.js", "static/*.css"]
