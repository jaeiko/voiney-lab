[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-workflow-agent"
version = "0.1.0"
description = "Trusted laboratory protocol knowledge, voice execution, and auditable integration layer"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "openai",
  "PyJWT[crypto]>=2.10,<3",
  "pypdf==6.12.0",
  "python-dotenv",
  "requests",
  "webrtcvad-wheels==2.0.14",
  "websockets>=14,<17",
  "python-docx==1.2.0",
]

[project.scripts]
voice-workflow-replay = "voice_workflow_agent.replay_turns:main"
voice-workflow-evaluate = "voice_workflow_agent.voice_evaluation:main"

[project.optional-dependencies]
moss = [
  "moss>=1.0.0b19,<2",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
voice_workflow_agent = ["static/*.html", "static/*.js"]
